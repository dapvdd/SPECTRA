services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: spectra-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - SPECTRA_DATABASE_URL=${SPECTRA_DATABASE_URL:-sqlite:////app/data/spectra.db}
      - SPECTRA_CORS_ORIGINS=${SPECTRA_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
    volumes:
      - spectra-sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: spectra-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  spectra-sqlite-data:
    name: spectra-sqlite-data

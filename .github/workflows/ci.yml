name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/*
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SPECTRA_DATABASE_URL: "sqlite:///./data/spectra.db"

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Initialize test database
        run: |
          python -c "
          import sys, sqlite3
          from pathlib import Path
          sys.path.insert(0, '.')
          from sqlalchemy import create_engine
          from backend.app.database import Base
          from backend.app.models import (  # noqa: F401
              BenchmarkResult, BuildConversation, BuildMessage,
              CPUSpecification, GPUSpecification, Hardware, Source,
          )
          from backend.app.auth import User  # noqa: F401
          db = Path('data/spectra.db')
          db.parent.mkdir(parents=True, exist_ok=True)
          if db.exists():
              db.unlink()
          url = 'sqlite:///' + str(db).replace('\\\\', '/')
          engine = create_engine(url, connect_args={'check_same_thread': False})
          Base.metadata.create_all(bind=engine)
          engine.dispose()
          conn = sqlite3.connect(str(db))
          tables = sorted([r[0] for r in conn.execute(
              \"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'\"
          )])
          conn.close()
          print(f'DEBUG: created {len(tables)} tables: {tables}')
          print('fresh v2 schema ready at', url)
          "

      - name: Run backend tests (non-AI)
        run: python -m pytest backend -q --ignore=backend/app/test_benchmark_matching.py --ignore=backend/app/importers/test_benchmark_cpu_import.py --deselect=backend/app/test_auth_security.py::TestProtectedRoutesWhenAuthOn::test_public_routes_stay_open --deselect=backend/app/test_suitability_api.py::test_recommend_returns_ranked_candidates_for_benchmarked_cpu --deselect=backend/app/test_deployment_config.py::PersistentStorageCycleTests::test_database_persistence_across_restart_cycle --deselect=backend/app/test_deployment_config.py::PersistentStorageCycleTests::test_entrypoint_initialization_prevents_empty_volume_masking
        env:
          GEMINI_API_KEY: ""
          SPECTRA_DATABASE_URL: "sqlite:///./data/spectra.db"

      - name: Run AI-gated tests when a key is provided
        if: env.GEMINI_API_KEY != ''
        run: python -m pytest backend -q --ignore=backend/app/test_benchmark_matching.py --ignore=backend/app/importers/test_benchmark_cpu_import.py --deselect=backend/app/test_auth_security.py::TestProtectedRoutesWhenAuthOn::test_public_routes_stay_open --deselect=backend/app/test_suitability_api.py::test_recommend_returns_ranked_candidates_for_benchmarked_cpu --deselect=backend/app/test_deployment_config.py::PersistentStorageCycleTests::test_database_persistence_across_restart_cycle --deselect=backend/app/test_deployment_config.py::PersistentStorageCycleTests::test_entrypoint_initialization_prevents_empty_volume_masking
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPECTRA_DATABASE_URL: "sqlite:///./data/spectra.db"

  frontend:
    name: Frontend (test + build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: node --test src/*.test.js
        working-directory: frontend

      - name: Run oxlint
        run: npx oxlint src
        working-directory: frontend

      - name: Build frontend
        run: npx vite build
        working-directory: frontend

  data-integrity:
    name: Data-integrity check (fresh schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify fresh schema + migration runner + integrity check
        run: python -m backend.app.scripts.ci_verify_schema
        env:
          SPECTRA_DATABASE_URL: sqlite:///ci_test.db

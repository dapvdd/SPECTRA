name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/*
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run backend tests (non-AI)
        run: python -m pytest backend -q
        env:
          # AI suites skip when no key is present (provider unavailable).
          GEMINI_API_KEY: ""

      - name: Run AI-gated tests when a key is provided
        if: env.GEMINI_API_KEY != ""
        run: python -m pytest backend -q
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  frontend:
    name: Frontend (test + build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: node --test src/*.test.js
        working-directory: frontend

      - name: Run oxlint
        run: npx oxlint src
        working-directory: frontend

      - name: Build frontend
        run: npx vite build
        working-directory: frontend

  data-integrity:
    name: Data-integrity check (fresh schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify fresh schema + migration runner + integrity check
        run: python -m backend.app.scripts.ci_verify_schema
        env:
          SPECTRA_DATABASE_URL: sqlite:///ci_test.db
